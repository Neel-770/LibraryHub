<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LibraryHub — University Library Seat & Facility Reservation System</title>
  
  <!-- Favicon SVG -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563EB' stroke-width='2'><path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/></svg>">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <!-- Theme Initialization Script (Prevents flash of unstyled theme) -->
  <script>
    (function() {
      try {
        var savedTheme = localStorage.getItem("lh_theme");
        if (!savedTheme) {
          var rawSettings = localStorage.getItem("lh_settings");
          if (rawSettings) {
            var parsed = JSON.parse(rawSettings);
            if (parsed && (parsed.theme === "dark" || parsed.theme === "light")) {
              savedTheme = parsed.theme;
            }
          }
        }
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var theme = savedTheme === "dark" || (!savedTheme && prefersDark) ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- App Shell Layout -->
  <div class="app-layout" id="app-layout">
    
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

    <!-- Left Sidebar Navigation -->
    <aside class="app-sidebar" id="app-sidebar" aria-label="Main Navigation">
      <div class="sidebar-brand">
        <div class="brand-logo-icon">
          <svg class="icon-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
        </div>
        <div class="brand-text-block">
          <span class="brand-title">Library<span class="brand-accent">Hub</span></span>
          <span class="brand-subtitle">Campus Resource System</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <div class="nav-group-label">OVERVIEW</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#dashboard" class="nav-link active" data-view="dashboard" id="nav-dashboard">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
              <span>Dashboard</span>
            </a>
          </li>
        </ul>

        <div class="nav-group-label">FACILITIES & SEATS</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#computer-labs" class="nav-link" data-view="computer-labs" id="nav-computer-labs">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              <span>Computer Labs</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#discussion-rooms" class="nav-link" data-view="discussion-rooms" id="nav-discussion-rooms">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              <span>Discussion Rooms</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#study-room" class="nav-link" data-view="study-room" id="nav-study-room">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
              <span>Honors Study Room</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#library-seats" class="nav-link" data-view="library-seats" id="nav-library-seats">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <span>Library Seats (Map)</span>
            </a>
          </li>
        </ul>

        <div class="nav-group-label">STUDENT SERVICES</div>
        <ul class="nav-list">
          <li class="nav-item">
            <a href="#my-bookings" class="nav-link" data-view="my-bookings" id="nav-my-bookings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
              <span>My Reservations</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#profile-settings" class="nav-link" data-view="profile-settings" id="nav-profile-settings">
              <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              <span>Profile & Settings</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Sidebar Bottom Student Mini-Profile -->
      <div class="sidebar-user-footer">
        <a href="#profile-settings" class="user-mini-card" data-view="profile-settings" title="View Profile & Settings">
          <div class="user-avatar-circle user-avatar-initials">AR</div>
          <div class="user-info-text">
            <span class="user-name current-user-name">Alex Rivera</span>
            <span class="user-role current-user-role">CS Junior</span>
          </div>
          <svg class="user-card-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>
    </aside>

    <!-- Main Content Shell -->
    <div class="app-main">
      
      <!-- Top Application Header -->
      <header class="app-topbar">
        <div class="topbar-left">
          <!-- Mobile Hamburger Toggle -->
          <button class="mobile-toggle-btn" id="mobile-menu-btn" aria-label="Toggle navigation drawer" aria-expanded="false">
            <svg class="icon-toggle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>

          <!-- Current View Title & Breadcrumb -->
          <div class="topbar-titles">
            <div class="breadcrumbs" id="page-header-crumb">Dashboard</div>
            <h1 class="page-title" id="page-header-title">Library Overview</h1>
          </div>
        </div>

        <div class="topbar-right">
          <!-- Live Date Badge -->
          <div class="topbar-date-pill">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span id="header-current-date">Today</span>
          </div>

          <!-- Theme Toggle Button (Dark / Light Mode) -->
          <button class="topbar-icon-btn theme-toggle-btn" id="theme-toggle-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode" aria-pressed="false">
            <!-- Sun icon (shown in dark mode to switch to light) -->
            <svg class="icon-theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon icon (shown in light mode to switch to dark) -->
            <svg class="icon-theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>

          <!-- Notification Bell Dropdown -->
          <div class="notifications-container">
            <button class="topbar-icon-btn" id="notifications-bell-btn" aria-label="View notifications and active reservations">
              <svg class="icon-bell" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
              <span class="notification-badge" id="notification-badge-count" style="display:none;">0</span>
            </button>
            <div class="notifications-dropdown-menu" id="notifications-dropdown">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- User Chip -->
          <a href="#profile-settings" class="topbar-user-chip" data-view="profile-settings">
            <div class="user-chip-avatar user-avatar-initials">AR</div>
            <span class="user-chip-name current-user-name">Alex Rivera</span>
          </a>
        </div>
      </header>

      <!-- Dynamic View Container -->
      <main class="main-content-scroll" id="main-content-area">
        <div class="view-content-container" id="view-container">
          <!-- Active view will be dynamically injected here via ES modules -->
        </div>
      </main>
    </div>

  </div>

  <!-- Global Modal Root -->
  <div id="app-modal-root" class="modal-overlay-root" aria-hidden="true"></div>

  <!-- Global Toast Notification Stack -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
